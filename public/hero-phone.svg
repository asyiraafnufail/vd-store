<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" fill="none">
  <!-- Body -->
  <rect x="20" y="10" width="280" height="540" rx="44" fill="#1A1A2E"/>
  <!-- Screen bezel -->
  <rect x="30" y="20" width="260" height="520" rx="36" fill="#16213E"/>
  <!-- Screen -->
  <rect x="36" y="26" width="248" height="508" rx="30" fill="#0a0a1a"/>
  <!-- Dynamic island -->
  <rect x="120" y="42" width="80" height="22" rx="11" fill="#1A1A2E"/>
  <!-- Screen content — gradient shimmer -->
  <defs>
    <linearGradient id="screen" x1="36" y1="26" x2="284" y2="534" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="36" y1="26" x2="160" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="36" y="26" width="248" height="508" rx="30" fill="url(#screen)"/>
  <rect x="36" y="26" width="248" height="508" rx="30" fill="url(#shine)"/>
  <!-- Amber accent line on screen -->
  <rect x="60" y="160" width="80" height="3" rx="1.5" fill="#F5A623" opacity="0.8"/>
  <!-- Fake text lines -->
  <rect x="60" y="175" width="200" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
  <rect x="60" y="193" width="160" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
  <rect x="60" y="211" width="180" height="10" rx="5" fill="#ffffff" opacity="0.06"/>
  <!-- Camera module -->
  <rect x="196" y="52" width="72" height="72" rx="20" fill="#111128"/>
  <circle cx="232" cy="72" r="14" fill="#0a0a1a"/>
  <circle cx="232" cy="72" r="10" fill="#1a1a2e"/>
  <circle cx="232" cy="72" r="6" fill="#0a0a1a"/>
  <circle cx="228" cy="68" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="210" cy="100" r="10" fill="#0a0a1a"/>
  <circle cx="210" cy="100" r="6" fill="#1a1a2e"/>
  <circle cx="256" cy="100" r="7" fill="#111128"/>
  <!-- Side buttons -->
  <rect x="0" y="160" width="6" height="50" rx="3" fill="#2a2a4e"/>
  <rect x="0" y="220" width="6" height="80" rx="3" fill="#2a2a4e"/>
  <rect x="314" y="180" width="6" height="100" rx="3" fill="#2a2a4e"/>
  <!-- Body shine -->
  <rect x="20" y="10" width="280" height="540" rx="44" fill="url(#shine)" opacity="0.5"/>
</svg>
